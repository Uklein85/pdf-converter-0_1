name: Build DocumentOCR

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUNBUFFERED: "1"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6"

      - name: Prepare OCR models
        run: python prepare_models.py

      - name: Syntax check
        run: python -m py_compile main.py pipeline.py gpr_core.py pdf_io.py exporters.py ocr_engines.py

      - name: Smoke test
        run: python smoke_test.py

      - name: Build EXE
        run: pyinstaller --noconfirm --clean DocumentOCR.spec

      - name: Stage release
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\DocumentOCR.exe" release\ -Force
          Copy-Item "ocr_models" release\ocr_models -Recurse -Force
          if (Test-Path README.md) { Copy-Item README.md release\ }
          $exe = Get-Item "release\DocumentOCR.exe"
          "EXE size: {0:N1} MB" -f ($exe.Length / 1MB) | Write-Host
          Compress-Archive -Path release\* -DestinationPath DocumentOCR-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentOCR-Windows-x64
          path: DocumentOCR-Windows-x64.zip
          retention-days: 90
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DocumentOCR-Windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
